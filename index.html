<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2474d3" />
    <meta name="description" content="Sistema de preventivas elétricas - Barra Shopping Sul" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Preventiva" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Preventiva - Sistema de Preventivas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('SW registered:', reg.scope);
          }).catch((err) => {
            console.log('SW registration failed:', err);
          });
        });
      }

      // Detect iOS standalone mode
      if (window.navigator.standalone === true) {
        document.documentElement.classList.add('ios-standalone');
      }

      // Prevent zoom on input focus (iOS)
      document.addEventListener('touchstart', () => {}, { passive: true });
    </script>
  </body>
</html>
